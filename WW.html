		<!-- Slideshow + slider + video styles -->
		<style>
			/* Container centered in the page */
			.ww-shell{
				width: 100%;
				display: flex;
				justify-content: center; /* center the whole block */
			}

			/* Row: slideshow left, slider middle, video right */
			.ww-row{
				display: flex;
				align-items: center;
				justify-content: center; /* center within available space */
				gap: 18px;
				max-width: 100%;
			}

			/* Stage: size is set by JS to fit the browser (no cropping) */
			.ww-stage{
				position: relative;
				overflow: hidden;   /* required for slide-out animation */
				border-radius: 8px;
				background: transparent;
			}

			/* Slide animation: old exits upward (bottom -> top effect) */
			.ww-slideWrap{
				position: absolute;
				inset: 0;
				display: grid;
				place-items: center;
				transform: translateY(0);
				opacity: 1;
				transition: transform 420ms ease, opacity 420ms ease;
				will-change: transform, opacity;
			}

			.ww-slideWrap.is-leaving{
				transform: translateY(-100%);
				opacity: 0;
			}

			.ww-slideWrap.is-entering{
				transform: translateY(100%);
				opacity: 0;
			}

			/* Never crop images */
			.ww-slideWrap img{
				width: 100%;
				height: 100%;
				object-fit: contain;
				display: block;
			}

			/* Slider on the right of slideshow:
			   - size (height = stage height, width = height/15) is set by JS
			   - buttons share height evenly */
			.ww-dots{
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				user-select: none;
				gap: 10px;
			}

			.ww-dot{
				width: 100%;
				flex: 1 1 0;
				min-height: 12px;
				border-radius: 3px;
				border: 1px solid rgba(0,0,0,0.25);
				background: rgba(0,0,0,0.12);
				cursor: pointer;
				padding: 0;
			}
			.ww-dot.is-active{ background: rgba(0,0,0,0.45); }

			.ww-dot:focus-visible{
				outline: 2px solid rgba(0,0,0,0.55);
				outline-offset: 3px;
			}

			/* Video on the far right (size set by JS) */
			.ww-video{
				border-radius: 8px;
				overflow: hidden;
				background: transparent;
				display: grid;
				place-items: center;
			}
			.ww-video video{
				width: 100%;
				height: 100%;
				object-fit: contain; /* never crop */
				display: block;
			}

			/* On very small screens, allow wrapping so it still fits */
			@media (max-width: 640px){
				.ww-row{
					flex-direction: column;
				}
				.ww-dots{
					flex-direction: row;
					width: 100% !important;   /* JS sets px; override for mobile row */
					height: 14px !important;  /* slim strip on mobile */
				}
				.ww-dot{
					height: 100%;
					min-height: 0;
				}
				.ww-video{
					width: 100% !important;
					height: auto !important;
				}
				.ww-video video{
					height: auto;
				}
			}

			@media (prefers-reduced-motion: reduce){
				.ww-slideWrap{ transition: none !important; }
			}

		<!-- Slideshow logic:
		     - slider on the right
		     - click -> old slide exits upward (bottom-to-top)
		     - stage/slider/video sizes auto-fit the browser without cropping
		-->
		<script>
			(function () {
				// --- CONFIG ---
				const SLIDE_RATIO_W = 9;     // portrait 9:16
				const SLIDE_RATIO_H = 16;
				const SLIDER_RATIO_HW = 15; // height:width = 15:1
				const VIDEO_RATIO_HW = 4/3;   // height:width = 5:1 (smaller = wider video). adjust if needed
				const GAP_PX = 18;          // must match CSS gap in .ww-row
				const ANIM_MS = 420;

				const slides = [
					{ src: "images/WW1.png", alt: "WW image 1" },
					{ src: "images/WW2.png", alt: "WW image 2" },
					{ src: "images/WW3.png", alt: "WW image 3" }
				];

				const stage = document.getElementById("wwStage");
				const dotsWrap = document.getElementById("wwDots");
				const videoBox = document.getElementById("wwVideo");
				const inner = document.querySelector("#main .inner");

				let currentIndex = 0;
				let currentWrap = null;
				let isAnimating = false;
				let dots = [];

				function createSlideWrap(i) {
					const wrap = document.createElement("div");
					wrap.className = "ww-slideWrap";

					const img = document.createElement("img");
					img.src = slides[i].src;
					img.alt = slides[i].alt;

					wrap.appendChild(img);
					return wrap;
				}

				function setActiveDot(i) {
					dots.forEach((d, di) => d.classList.toggle("is-active", di === i));
				}

				function buildDots() {
					dotsWrap.innerHTML = "";
					dots = slides.map((_, i) => {
						const btn = document.createElement("button");
						btn.type = "button";
						btn.className = "ww-dot";
						btn.setAttribute("aria-label", `Show slide ${i + 1}`);
						btn.addEventListener("click", () => goTo(i));
						dotsWrap.appendChild(btn);
						return btn;
					});
				}

				function goTo(nextIndex) {
					if (isAnimating) return;
					if (nextIndex === currentIndex) return;

					isAnimating = true;

					const nextWrap = createSlideWrap(nextIndex);
					nextWrap.classList.add("is-entering");
					stage.appendChild(nextWrap);

					// Force reflow
					void nextWrap.offsetWidth;

					if (currentWrap) currentWrap.classList.add("is-leaving");
					nextWrap.classList.remove("is-entering");

					window.setTimeout(() => {
						if (currentWrap && currentWrap.parentNode === stage) stage.removeChild(currentWrap);
						currentWrap = nextWrap;
						currentIndex = nextIndex;
						setActiveDot(currentIndex);
						isAnimating = false;
					}, ANIM_MS);
				}

				// Fit stage + slider + video to browser (maximize without overflow)
				function fitToBrowser() {
					// available width should respect the template inner container
					const availW = Math.min(window.innerWidth, inner ? inner.clientWidth : window.innerWidth);

					// available height: keep some breathing room for header/footer/content
					const availH = Math.max(240, Math.floor(window.innerHeight * 0.9));

					// If mobile layout stacks (slider becomes row), sizing is different
					const isStacked = window.matchMedia("(max-width: 640px)").matches;

					if (isStacked) {
						// Stage takes most of the width; height derived from ratio, but capped by availH
						const stageW = Math.min(availW, Math.floor(window.innerWidth * 0.96));
						const stageH = Math.min(availH, Math.floor(stageW * SLIDE_RATIO_H / SLIDE_RATIO_W));

						stage.style.width = stageW + "px";
						stage.style.height = stageH + "px";

						// Slider becomes a horizontal strip under stage
						dotsWrap.style.height = "14px";
						dotsWrap.style.width = stageW + "px";

						// Video stacks under slider; use 16:9-ish height
						if (videoBox){
							videoBox.style.width = stageW + "px";
							videoBox.style.height = Math.min(availH, Math.floor(stageW * 9 / 16)) + "px";
						}
						return;
					}

					// Desktop (side-by-side): stage + gap + slider + gap + video
					// stageW = h*(9/16), sliderW = h/15, videoW = h/VIDEO_RATIO_HW
					const coeff = (SLIDE_RATIO_W / SLIDE_RATIO_H) + (1 / SLIDER_RATIO_HW) + (1 / VIDEO_RATIO_HW);

					// Two gaps now (stage<->slider and slider<->video)
					let stageH = Math.min(
						availH,
						Math.floor((availW - (GAP_PX * 2)) / coeff)
					);

					// Safety clamp
					stageH = Math.max(240, stageH);

					const stageW = Math.floor(stageH * SLIDE_RATIO_W / SLIDE_RATIO_H);
					const sliderW = Math.max(40, Math.floor(stageH / SLIDER_RATIO_HW));
					const videoW  = Math.max(220, Math.floor(stageH / VIDEO_RATIO_HW));

					stage.style.width = stageW + "px";
					stage.style.height = stageH + "px";

					dotsWrap.style.height = stageH + "px";
					dotsWrap.style.width = sliderW + "px";

					if (videoBox){
						videoBox.style.height = stageH + "px";
						videoBox.style.width = videoW + "px";
					}
				}

				// Init
				buildDots();
				currentWrap = createSlideWrap(0);
				stage.appendChild(currentWrap);
				setActiveDot(0);

				window.addEventListener("load", fitToBrowser);
				window.addEventListener("resize", fitToBrowser);
			})();
		</script>
