	<style>
		/* Overall WW block */
		.ww-shell {
			width: 100%;
			display: flex;
			flex-direction: column;
			gap: 18px;
		}

		/* TOP row: left media + right video (same height) */
		.ww-top {
			width: 100%;
			display: flex;
			align-items: flex-start;
			justify-content: center;
			gap: 18px; /* keep in sync with JS GAP_PX */
		}

		/* Left side = stage + dots */
		.ww-left {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 18px; /* keep in sync with JS GAP_PX */
			flex: 0 0 auto;
		}

		/* Stage: size is set by JS */
		.ww-stage {
			position: relative;
			overflow: hidden;
			border-radius: 10px;
			background: transparent;
		}

		/* Slide animation */
		.ww-slideWrap {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			transform: translateY(0);
			opacity: 1;
			transition: transform 420ms ease, opacity 420ms ease;
			will-change: transform, opacity;
		}
		.ww-slideWrap.is-leaving { transform: translateY(-100%); opacity: 0; }
		.ww-slideWrap.is-entering { transform: translateY(100%); opacity: 0; }

		/* Never crop images */
		.ww-slideWrap img {
			width: 100%;
			height: 100%;
			object-fit: contain;
			display: block;
		}

		/* Dots column (height set by JS) */
		.ww-dots {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			user-select: none;
			gap: 10px;
		}
		.ww-dot {
			width: 100%;
			flex: 1 1 0;
			min-height: 12px;
			border-radius: 4px;
			border: 1px solid rgba(0,0,0,0.25);
			background: rgba(0,0,0,0.12);
			cursor: pointer;
			padding: 0;
		}
		.ww-dot.is-active { background: rgba(0,0,0,0.45); }
		.ww-dot:focus-visible {
			outline: 2px solid rgba(0,0,0,0.55);
			outline-offset: 3px;
		}

		/* Video box (width/height set by JS) */
		.ww-video {
			flex: 0 0 auto;
		}

		.video-wrap, .video-wrap iframe {
			width: 100%;
			height: 100%;
			display: block;
			border: 0;
			border-radius: 10px; /* match image rounding */
			overflow: hidden;
		}

		/* Descriptions below */
		.ww-desc {
			width: 100%;
		}
		.ww-desc p {
			margin: 0 0 10px 0;
		}

		/* Mobile: stack media vertically */
		@media (max-width: 640px) {
			.ww-top {
				flex-direction: column;
				align-items: center;
			}
			.ww-left {
				flex-direction: row;
			}
			.ww-desc {
				text-align: left;
			}
		}
	</style>

	<!-- Slideshow + sizing logic (image and video same height) -->
	<script>
		(function () {
			// --- CONFIG ---
			const SLIDE_RATIO_W = 9;       // portrait image: 9:16
			const SLIDE_RATIO_H = 16;

			const VIDEO_ASPECT_W = 16;     // video: 16:9 like picture 2
			const VIDEO_ASPECT_H = 9;

			const SLIDER_RATIO_HW = 15;    // dots: height:width = 15:1
			const GAP_PX = 18;             // MUST match CSS gap
			const ANIM_MS = 420;

			const slides = [
				{ src: "images/WW1.png", alt: "WW image 1" },
				{ src: "images/WW2.png", alt: "WW image 2" },
				{ src: "images/WW3.png", alt: "WW image 3" }
			];

			const stage = document.getElementById("wwStage");
			const dotsWrap = document.getElementById("wwDots");
			const videoBox = document.getElementById("wwVideo");
			const inner = document.querySelector("#main .inner");

			let currentIndex = 0;
			let currentWrap = null;
			let isAnimating = false;
			let dots = [];

			function createSlideWrap(i) {
				const wrap = document.createElement("div");
				wrap.className = "ww-slideWrap";

				const img = document.createElement("img");
				img.src = slides[i].src;
				img.alt = slides[i].alt;

				wrap.appendChild(img);
				return wrap;
			}

			function setActiveDot(i) {
				dots.forEach((d, di) => d.classList.toggle("is-active", di === i));
			}

			function buildDots() {
				dotsWrap.innerHTML = "";
				dots = slides.map((_, i) => {
					const btn = document.createElement("button");
					btn.type = "button";
					btn.className = "ww-dot";
					btn.setAttribute("aria-label", `Show slide ${i + 1}`);
					btn.addEventListener("click", () => goTo(i));
					dotsWrap.appendChild(btn);
					return btn;
				});
			}

			function goTo(nextIndex) {
				if (isAnimating) return;
				if (nextIndex === currentIndex) return;

				isAnimating = true;

				const nextWrap = createSlideWrap(nextIndex);
				nextWrap.classList.add("is-entering");
				stage.appendChild(nextWrap);

				void nextWrap.offsetWidth;

				if (currentWrap) currentWrap.classList.add("is-leaving");
				nextWrap.classList.remove("is-entering");

				window.setTimeout(() => {
					if (currentWrap && currentWrap.parentNode === stage) stage.removeChild(currentWrap);
					currentWrap = nextWrap;
					currentIndex = nextIndex;
					setActiveDot(currentIndex);
					isAnimating = false;
				}, ANIM_MS);
			}

			function fitToBrowser() {
				const availW = Math.min(window.innerWidth, inner ? inner.clientWidth : window.innerWidth);
				const availH = Math.max(260, Math.floor(window.innerHeight * 0.75));
				const isStacked = window.matchMedia("(max-width: 640px)").matches;

				if (isStacked) {
					// Image takes most width; video same height but full width below
					const stageW = Math.min(availW, Math.floor(window.innerWidth * 0.96));
					const stageH = Math.min(availH, Math.floor(stageW * SLIDE_RATIO_H / SLIDE_RATIO_W));

					stage.style.width = stageW + "px";
					stage.style.height = stageH + "px";

					dotsWrap.style.height = stageH + "px";
					dotsWrap.style.width = Math.max(40, Math.floor(stageH / SLIDER_RATIO_HW)) + "px";

					// video below: use 16:9 sizing by width
					const videoW = stageW;
					const videoH = Math.floor(videoW * VIDEO_ASPECT_H / VIDEO_ASPECT_W);

					videoBox.style.width = videoW + "px";
					videoBox.style.height = videoH + "px";
					return;
				}

				// Desktop: total width = stageW + gap + dotsW + gap + videoW
				// stageW = h*(9/16)
				// dotsW  = h/15
				// videoW = h*(16/9)
				const coeff =
					(SLIDE_RATIO_W / SLIDE_RATIO_H) +
					(1 / SLIDER_RATIO_HW) +
					(VIDEO_ASPECT_W / VIDEO_ASPECT_H);

				let h = Math.min(
					availH,
					Math.floor((availW - (GAP_PX * 2)) / coeff)
				);

				h = Math.max(260, h);

				const stageW = Math.floor(h * SLIDE_RATIO_W / SLIDE_RATIO_H);
				const dotsW  = Math.max(44, Math.floor(h / SLIDER_RATIO_HW));
				const videoW = Math.floor(h * VIDEO_ASPECT_W / VIDEO_ASPECT_H);

				stage.style.width = stageW + "px";
				stage.style.height = h + "px";

				dotsWrap.style.height = h + "px";
				dotsWrap.style.width = dotsW + "px";

				videoBox.style.height = h + "px";
				videoBox.style.width = videoW + "px";
			}

			// Init
			buildDots();
			currentWrap = createSlideWrap(0);
			stage.appendChild(currentWrap);
			setActiveDot(0);

			window.addEventListener("load", fitToBrowser);
			window.addEventListener("resize", fitToBrowser);
		})();
	</script>
