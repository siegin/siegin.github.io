	<style>
		.ww-shell {
			width: 100%;
			display: flex;
			flex-direction: column;
			gap: 18px;
		}

		.ww-top {
			width: 100%;
			display: flex;
			align-items: stretch;
			justify-content: center;
			gap: 18px;
			flex-wrap: nowrap;
		}

		.ww-left {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 18px;
			flex: 0 0 auto;
			min-width: 0;
		}

		.ww-stage {
			position: relative;
			overflow: hidden;
			border-radius: 10px;
			background: transparent;
			width: 360px;
			height: 640px;
			flex: 0 0 auto;
		}

		.ww-slideWrap {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			transform: translateY(0);
			opacity: 1;
			transition: transform 420ms ease, opacity 420ms ease;
			will-change: transform, opacity;
		}

			.ww-slideWrap.is-leaving {
				transform: translateY(-100%);
				opacity: 0;
			}

			.ww-slideWrap.is-entering {
				transform: translateY(100%);
				opacity: 0;
			}

			.ww-slideWrap img {
				width: 100%;
				height: 100%;
				object-fit: contain;
				display: block;
			}

		.ww-dots {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			user-select: none;
			gap: 10px;
			position: relative;
			z-index: 5;
			width: 44px;
			height: 640px;
			flex: 0 0 auto;
		}

		.ww-dot {
			width: 100%;
			flex: 1 1 0;
			min-height: 12px;
			border-radius: 4px;
			border: 1px solid rgba(0,0,0,0.25);
			background: rgba(0,0,0,0.12);
			cursor: pointer;
			padding: 0;
		}

			.ww-dot.is-active {
				background: rgba(0,0,0,0.45);
			}

		.ww-video {
			flex: 0 0 auto;
			min-width: 0;
			background: #000;
			border-radius: 10px;
			overflow: hidden;
			width: 360px;
			height: 640px;
		}

		.video-wrap {
			width: 100%;
			height: 100%;
			position: relative;
			overflow: hidden;
			background: #000;
		}

			.video-wrap iframe {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%,-50%);
				border: 0;
			}

		.ww-desc p {
			margin: 0 0 10px 0;
		}

		@media (max-width:640px) {
			.ww-top {
				flex-direction: column;
				align-items: center;
			}

			.ww-left {
				flex-direction: row;
				align-items: center;
			}

			.ww-dots {
				height: 640px;
			}
		}
	</style>

	<script>
		document.addEventListener("DOMContentLoaded", () => {
			(function () {
				// ✅ keep ONLY ONE VIDEO_URL
				const VIDEO_URL = "https://www.youtube.com/watch?v=0hc0xK4qXK4";

				const SLIDE_RATIO_W = 9;
				const SLIDE_RATIO_H = 16;

				let VIDEO_ASPECT_W = 16;
				let VIDEO_ASPECT_H = 9;

				const SLIDER_RATIO_HW = 15;
				const GAP_PX = 18;
				const ANIM_MS = 420;

				const slides = [
					{ src: "images/WW1.png", alt: "WW image 1" },
					{ src: "images/WW2.png", alt: "WW image 2" },
					{ src: "images/WW3.png", alt: "WW image 3" }
				];

				const stage = document.getElementById("wwStage");
				const dotsWrap = document.getElementById("wwDots");
				const videoBox = document.getElementById("wwVideo");
				const videoContainer = document.getElementById("video-container");
				const inner = document.querySelector("#main .inner");

				let currentIndex = 0;
				let currentWrap = null;
				let isAnimating = false;
				let dots = [];

				function isShortsUrl(url) {
					return /youtube\.com\/shorts\//i.test(url);
				}

				function extractYouTubeId(url) {
					try {
						const m1 = url.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/);
						if (m1) return m1[1];

						const u = new URL(url);
						const v = u.searchParams.get("v");
						if (v) return v;

						const m2 = url.match(/youtube\.com\/shorts\/([A-Za-z0-9_-]{6,})/);
						if (m2) return m2[1];

						const m3 = url.match(/youtube\.com\/embed\/([A-Za-z0-9_-]{6,})/);
						if (m3) return m3[1];

						return "";
					} catch {
						if (/^[A-Za-z0-9_-]{6,}$/.test(url)) return url;
						return "";
					}
				}

				function createSlideWrap(i) {
					const wrap = document.createElement("div");
					wrap.className = "ww-slideWrap";
					const img = document.createElement("img");
					img.src = slides[i].src;
					img.alt = slides[i].alt;
					wrap.appendChild(img);
					return wrap;
				}

				function setActiveDot(i) {
					dots.forEach((d, di) => d.classList.toggle("is-active", di === i));
				}

				function buildDots() {
					dotsWrap.innerHTML = "";
					dots = slides.map((_, i) => {
						const btn = document.createElement("button");
						btn.type = "button";
						btn.className = "ww-dot";
						btn.setAttribute("aria-label", "Show slide " + (i + 1));
						btn.addEventListener("click", () => goTo(i));
						dotsWrap.appendChild(btn);
						return btn;
					});
				}

				function goTo(nextIndex) {
					if (isAnimating) return;
					if (nextIndex === currentIndex) return;

					isAnimating = true;

					const nextWrap = createSlideWrap(nextIndex);
					nextWrap.classList.add("is-entering");
					stage.appendChild(nextWrap);
					void nextWrap.offsetWidth;

					if (currentWrap) currentWrap.classList.add("is-leaving");
					nextWrap.classList.remove("is-entering");

					window.setTimeout(() => {
						if (currentWrap && currentWrap.parentNode === stage) stage.removeChild(currentWrap);
						currentWrap = nextWrap;
						currentIndex = nextIndex;
						setActiveDot(currentIndex);
						isAnimating = false;
					}, ANIM_MS);
				}

				function fitVideoCover() {
					const wrap = videoBox.querySelector(".video-wrap");
					const iframe = wrap ? wrap.querySelector("iframe") : null;
					if (!wrap || !iframe) return;

					const boxW = wrap.clientWidth;
					const boxH = wrap.clientHeight;
					if (boxW <= 0 || boxH <= 0) { setTimeout(fitVideoCover, 60); return; }

					const videoRatio = VIDEO_ASPECT_W / VIDEO_ASPECT_H;
					const boxRatio = boxW / boxH;

					let w, h;
					if (boxRatio > videoRatio) {
						w = boxW;
						h = Math.ceil(boxW / videoRatio);
					} else {
						h = boxH;
						w = Math.ceil(boxH * videoRatio);
					}

					iframe.style.width = w + "px";
					iframe.style.height = h + "px";
				}

				function safeInnerWidth() {
					const w = inner ? inner.getBoundingClientRect().width : 0;
					return Math.max(320, Math.floor(w || window.innerWidth));
				}

				function fitToBrowser() {
					const availW = Math.min(window.innerWidth, safeInnerWidth());
					const availH = Math.max(260, Math.floor(window.innerHeight * 0.75));
					const isStacked = window.matchMedia("(max-width: 640px)").matches;

					if (isStacked) {
						const stageW = Math.min(availW, Math.floor(window.innerWidth * 0.96));
						const stageH = Math.min(availH, Math.floor(stageW * SLIDE_RATIO_H / SLIDE_RATIO_W));

						stage.style.width = stageW + "px";
						stage.style.height = stageH + "px";

						dotsWrap.style.height = stageH + "px";
						dotsWrap.style.width = Math.max(44, Math.floor(stageH / SLIDER_RATIO_HW)) + "px";

						videoBox.style.width = stageW + "px";
						videoBox.style.height = stageH + "px";

						fitVideoCover();
						return;
					}

					const coeff =
						(SLIDE_RATIO_W / SLIDE_RATIO_H) +
						(1 / SLIDER_RATIO_HW) +
						(VIDEO_ASPECT_W / VIDEO_ASPECT_H);

					let h = Math.min(availH, Math.floor((availW - (GAP_PX * 2)) / coeff));
					h = Math.max(260, h);

					const stageW = Math.floor(h * SLIDE_RATIO_W / SLIDE_RATIO_H);
					const dotsW = Math.max(44, Math.floor(h / SLIDER_RATIO_HW));
					const videoW = Math.floor(h * VIDEO_ASPECT_W / VIDEO_ASPECT_H);

					stage.style.width = stageW + "px";
					stage.style.height = h + "px";

					dotsWrap.style.height = h + "px";
					dotsWrap.style.width = dotsW + "px";

					videoBox.style.height = h + "px";
					videoBox.style.width = videoW + "px";

					fitVideoCover();
				}

				function loadYouTube() {
					const id = extractYouTubeId(VIDEO_URL);
					if (!id) return;

					if (isShortsUrl(VIDEO_URL)) {
						VIDEO_ASPECT_W = 9;
						VIDEO_ASPECT_H = 16;
					} else {
						VIDEO_ASPECT_W = 16;
						VIDEO_ASPECT_H = 9;
					}

                    const embedSrc =
                        `https://www.youtube-nocookie.com/embed/${id}` +
                        `?playsinline=1&rel=0&controls=1&modestbranding=1`;

					videoContainer.innerHTML =
						`<div class="video-wrap">
								<iframe
									src="${embedSrc}"
									title="YouTube video"
									allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
									allowfullscreen>
								</iframe>
							</div>`;

					const iframe = videoContainer.querySelector("iframe");
					if (iframe) {
						iframe.addEventListener("load", () => {
							fitToBrowser();
							setTimeout(fitToBrowser, 60);
						});
					}
				}

				function start() {
					buildDots();
					currentWrap = createSlideWrap(0);
					stage.appendChild(currentWrap);
					setActiveDot(0);
					loadYouTube();
					fitToBrowser();
				}

				start();
				setTimeout(start, 300);
				window.addEventListener("resize", fitToBrowser);
			})();
		});
	</script>
